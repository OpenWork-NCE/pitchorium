name: Setup
description: Install Node.js from .nvmrc, pnpm from packageManager, and the workspace dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
