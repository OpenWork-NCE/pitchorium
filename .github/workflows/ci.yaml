name: CI

# Level 2 of the verification (docs/architecture/testing.md, ADR 0123): blocking at each push and
# pull request, 15 minutes at most. The suites of level 3 run in nightly.yaml.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Areas touched since the last green run of main (or the base of the pull request): prudent
  # path filters, every area when in doubt (scripts/ci/changed-areas.mjs).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.areas.outputs.code }}
      web: ${{ steps.areas.outputs.web }}
      visual: ${{ steps.areas.outputs.visual }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then
            base="$(gh run list --workflow ci.yaml --branch main --status success --limit 1 \
              --json headSha --jq '.[0].headSha' || true)"
          fi
          node scripts/ci/changed-areas.mjs "$base" "$GITHUB_SHA"

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - name: Box-drawing characters (U+2500 to U+257F)
        run: pnpm check:box-drawing

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Boundaries of the modules and of the web app are ESLint rules.
      - run: pnpm lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  integration-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@pitchorium/server^...
      # Testcontainers starts Postgres, Valkey, MinIO, Mailpit and ClamAV through the runner's
      # Docker daemon; each shard has its own containers.
      - run: >-
          pnpm --filter @pitchorium/server exec vitest run -c vitest.integration.config.mts
          --shard=${{ matrix.shard }}/2

  # Scenarios of the api as processes (simulated contribution, real-time messaging, ...).
  api-e2e-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test:e2e --filter=@pitchorium/server
        env:
          TMPDIR: ${{ runner.temp }}
      # Logs of the seed, the api and the worker of the scenarios.
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-e2e-logs
          path: ${{ runner.temp }}/pitchorium-e2e-*
          if-no-files-found: ignore

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build
        with:
          web-e2e: ${{ needs.changes.outputs.web }}

  # Its own job: a budget exceeded does not keep the suites below from running.
  bundles:
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      - name: Initial JavaScript per route group and per view of the public pages
        run: pnpm --filter @pitchorium/web check:bundles .next-e2e --views

  web-e2e-tests:
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      # Stub api, the build of the run, Chromium in the official Playwright image (screenshots).
      - run: pnpm --filter @pitchorium/web test:e2e --project=chromium --max-failures=5
        env:
          E2E_SKIP_BUILD: '1'
      - if: always()
        run: node scripts/ci/playwright-summary.mjs apps/web/test-results/results.json 'Stub suite (Chromium)'
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: web-e2e-report
          path: apps/web/playwright-report
          include-hidden-files: true
          if-no-files-found: ignore

  live-critical:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      # Critical journeys (@critical, ADR 0127) against the real api, in Chromium.
      - run: >-
          pnpm --filter @pitchorium/web test:e2e:live
          --project=chromium --grep @critical --max-failures=5
        env:
          LIVE_SKIP_BUILD: '1'
          LIVE_LOGS: ${{ runner.temp }}/live-logs
      - if: always()
        run: node scripts/ci/playwright-summary.mjs apps/web/test-results/results.json 'Critical journeys (Chromium)'
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: live-critical
          path: |
            apps/web/playwright-report
            ${{ runner.temp }}/live-logs
          include-hidden-files: true
          if-no-files-found: ignore

  lighthouse:
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      # One run of one page per kind; every page three times at level 3. Same thresholds.
      - run: pnpm --filter @pitchorium/web lighthouse
        env:
          LHCI_SKIP_BUILD: '1'
          LHCI_RUNS: '1'
          LHCI_SCOPE: representative
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

  # Only when a component, a story, a style or the tokens change; always at level 3.
  storybook:
    needs: [changes, build]
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@pitchorium/web^...
      - run: pnpm turbo run build-storybook --filter=@pitchorium/web
      # The pages of the projects are captured on the build of the end-to-end tests (.next-e2e).
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      - name: Stories as tests (play functions, accessibility, both themes)
        run: pnpm --filter @pitchorium/web test:stories
      - name: Review captures compared with the committed ones
        run: pnpm --filter @pitchorium/web review:check
        env:
          REVIEW_SKIP_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: review-captures
          path: |
            apps/web/playwright-report
            apps/web/test-results
          include-hidden-files: true
          if-no-files-found: ignore

  consistency:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Migrations are consistent
        run: pnpm db:check
      - name: No schema change without a generated migration
        run: |
          pnpm db:generate
          git status --porcelain -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: OpenAPI document and Orval client are up to date
        run: |
          pnpm api-client:generate
          git diff --exit-code -- apps/server/openapi packages/api-client/src/generated
          test -z "$(git status --porcelain -- apps/server/openapi packages/api-client/src/generated)"
      - name: French and English translation keys are aligned
        run: pnpm i18n:check
      - name: No dead file, export or dependency (knip)
        run: pnpm check:dead-code

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Secrets in the history (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
      - uses: ./.github/actions/setup
      - name: Vulnerable production dependencies (high and above)
        run: pnpm audit --prod --audit-level high
      - name: No GPL or AGPL production dependency
        run: pnpm check:licenses

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image (api, worker, migrate)
        run: docker build -t pitchorium:ci .
      - name: Vulnerabilities of the image (Trivy, high and above, fixable)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          pitchorium:ci

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Conventional Commits with an allowed scope
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # One required check for the branch protection: green when every job passed or was skipped
  # by a path filter.
  level-2:
    if: always()
    needs:
      - changes
      - format
      - lint
      - typecheck
      - unit-tests
      - integration-tests
      - api-e2e-tests
      - build
      - bundles
      - web-e2e-tests
      - live-critical
      - lighthouse
      - storybook
      - consistency
      - security
      - image
      - commitlint
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Level 2 passed."
