name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Testcontainers starts Postgres and Valkey through the runner's Docker daemon.
      - run: pnpm test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Server: built api and worker as processes, containers started by Testcontainers.
      # Web: production build against a stub api, in the official Playwright image (screenshots).
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6.1.0
        with:
          path: apps/web/.next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Packages used by the web app
        run: pnpm turbo run build --filter=@pitchorium/web^...
      - name: Design system (Storybook)
        run: pnpm turbo run build-storybook --filter=@pitchorium/web
      - name: Lighthouse CI (mobile profile, budgets of lighthouserc.cjs)
        run: pnpm --filter @pitchorium/web lighthouse
      - name: Initial JavaScript per route group, no GSAP outside the editorial pages
        run: pnpm --filter @pitchorium/web check:bundles .next-e2e
      - if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Secrets in the history (gitleaks)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1
      - uses: ./.github/actions/setup
      - name: Vulnerable production dependencies (high and above)
        run: pnpm audit --prod --audit-level high
      - name: No GPL or AGPL production dependency
        run: pnpm check:licenses

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image (api, worker, migrate)
        run: docker build -t pitchorium:ci .
      - name: Vulnerabilities of the image (Trivy, high and above, fixable)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          pitchorium:ci
      - name: Software bill of materials (CycloneDX)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          aquasec/trivy:0.74.0 image --quiet --format cyclonedx --output /out/sbom.cdx.json
          pitchorium:ci
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  provider-sandboxes:
    runs-on: ubuntu-latest
    # Secrets cannot gate a job: each step runs only when a test key exists.
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_CONNECTED_ACCOUNT: ${{ secrets.STRIPE_TEST_CONNECTED_ACCOUNT }}
      FLUTTERWAVE_TEST_SECRET_KEY: ${{ secrets.FLUTTERWAVE_TEST_SECRET_KEY }}
      RESEND_TEST_API_KEY: ${{ secrets.RESEND_TEST_API_KEY }}
    steps:
      - if: env.STRIPE_TEST_SECRET_KEY != '' || env.FLUTTERWAVE_TEST_SECRET_KEY != '' || env.RESEND_TEST_API_KEY != ''
        uses: actions/checkout@v7.0.1
      - if: env.STRIPE_TEST_SECRET_KEY != '' || env.FLUTTERWAVE_TEST_SECRET_KEY != '' || env.RESEND_TEST_API_KEY != ''
        uses: ./.github/actions/setup
      - name: Real test APIs of Stripe and Flutterwave
        if: env.STRIPE_TEST_SECRET_KEY != '' || env.FLUTTERWAVE_TEST_SECRET_KEY != '' || env.RESEND_TEST_API_KEY != ''
        run: pnpm test:providers
      - name: No test key
        if: env.STRIPE_TEST_SECRET_KEY == '' && env.FLUTTERWAVE_TEST_SECRET_KEY == '' && env.RESEND_TEST_API_KEY == ''
        run: echo "No provider test key is set; provider sandboxes skipped."

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - name: Initial JavaScript per route group of the web app
        run: pnpm --filter @pitchorium/web check:bundles

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Box-drawing characters (U+2500 to U+257F)
        run: pnpm check:box-drawing
      - name: Migrations are consistent
        run: pnpm db:check
      - name: No schema change without a generated migration
        run: |
          pnpm db:generate
          git status --porcelain -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: OpenAPI document and Orval client are up to date
        run: |
          pnpm api-client:generate
          git diff --exit-code -- apps/server/openapi packages/api-client/src/generated
          test -z "$(git status --porcelain -- apps/server/openapi packages/api-client/src/generated)"
      - name: French and English translation keys are aligned
        run: pnpm i18n:check
      - name: No dead file, export or dependency (knip)
        run: pnpm check:dead-code

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Conventional Commits with an allowed scope
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
