name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      # Testcontainers starts Postgres and Valkey through the runner's Docker daemon.
      - run: pnpm test:integration

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - name: Box-drawing characters (U+2500 to U+257F)
        run: pnpm check:box-drawing
      - name: Migrations are consistent
        run: pnpm db:check
      - name: No schema change without a generated migration
        run: |
          pnpm db:generate
          git status --porcelain -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"
      - name: OpenAPI document and Orval client are up to date
        run: |
          pnpm api-client:generate
          git diff --exit-code -- apps/server/openapi packages/api-client/src/generated
          test -z "$(git status --porcelain -- apps/server/openapi packages/api-client/src/generated)"
      - name: French and English translation keys are aligned
        run: pnpm i18n:check

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Conventional Commits with an allowed scope
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
