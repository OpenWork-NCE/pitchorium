name: Nightly

# Level 3 of the verification (docs/architecture/testing.md, ADR 0123): every night, and on demand
# before a release or at the end of a prompt (gh workflow run nightly.yaml). A failure opens an
# issue (or comments the open one) with the link to the run, whose artifacts hold the traces.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # A test that only passes on its retry fails the run (playwright.config.ts).
  PLAYWRIGHT_FAIL_ON_FLAKY: '1'

jobs:
  # The definition of done from a clean clone (ADR 0063), real ClamAV included. The journeys
  # against the real api and Lighthouse run in the parallel jobs below, on the same commit.
  verify-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm verify:clean
        env:
          TMPDIR: ${{ runner.temp }}
          VERIFY_SKIP: '^web: (journeys against the real api|Lighthouse CI)$'
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verify-clean-logs
          path: ${{ runner.temp }}/pitchorium-verify-logs-*
          include-hidden-files: true
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build

  # Every journey against the real api, in each engine, on its own stack.
  live-journeys:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      - run: pnpm --filter @pitchorium/web test:e2e:live --project=${{ matrix.browser }}
        env:
          LIVE_SKIP_BUILD: '1'
          LIVE_LOGS: ${{ runner.temp }}/live-logs
      - if: always()
        run: >-
          node scripts/ci/playwright-summary.mjs apps/web/test-results/results.json
          'Journeys against the real api (${{ matrix.browser }})'
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: live-journeys-${{ matrix.browser }}
          path: |
            apps/web/playwright-report
            ${{ runner.temp }}/live-logs
          include-hidden-files: true
          if-no-files-found: ignore

  # Every followed page, three runs each (median), the thresholds of lighthouserc.cjs.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      - run: pnpm --filter @pitchorium/web lighthouse
        env:
          LHCI_SKIP_BUILD: '1'
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore

  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build --filter=@pitchorium/web^...
      - run: pnpm turbo run build-storybook --filter=@pitchorium/web
      - name: Stories as tests (play functions, accessibility, both themes)
        run: pnpm --filter @pitchorium/web test:stories
      - name: Review captures compared with the committed ones
        run: pnpm --filter @pitchorium/web review:check
        env:
          REVIEW_SKIP_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: review-captures
          path: |
            apps/web/playwright-report
            apps/web/test-results
          include-hidden-files: true
          if-no-files-found: ignore

  provider-sandboxes:
    runs-on: ubuntu-latest
    # Secrets cannot gate a job: each step runs only when a test key exists.
    env:
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_CONNECTED_ACCOUNT: ${{ secrets.STRIPE_TEST_CONNECTED_ACCOUNT }}
      FLUTTERWAVE_TEST_SECRET_KEY: ${{ secrets.FLUTTERWAVE_TEST_SECRET_KEY }}
      RESEND_TEST_API_KEY: ${{ secrets.RESEND_TEST_API_KEY }}
    steps:
      - if: env.STRIPE_TEST_SECRET_KEY != '' || env.FLUTTERWAVE_TEST_SECRET_KEY != '' || env.RESEND_TEST_API_KEY != ''
        uses: actions/checkout@v7.0.1
      - if: env.STRIPE_TEST_SECRET_KEY != '' || env.FLUTTERWAVE_TEST_SECRET_KEY != '' || env.RESEND_TEST_API_KEY != ''
        uses: ./.github/actions/setup
      - name: Real test APIs of Stripe, Flutterwave and Resend
        if: env.STRIPE_TEST_SECRET_KEY != '' || env.FLUTTERWAVE_TEST_SECRET_KEY != '' || env.RESEND_TEST_API_KEY != ''
        run: pnpm test:providers
      - name: No test key
        if: env.STRIPE_TEST_SECRET_KEY == '' && env.FLUTTERWAVE_TEST_SECRET_KEY == '' && env.RESEND_TEST_API_KEY == ''
        run: echo "No provider test key is set; provider sandboxes skipped."

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image (api, worker, migrate)
        run: docker build -t pitchorium:nightly .
      - name: Vulnerabilities of the image (Trivy, high and above, fixable)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          pitchorium:nightly
      - name: Software bill of materials (CycloneDX)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out"
          aquasec/trivy:0.74.0 image --quiet --format cyclonedx --output /out/sbom.cdx.json
          pitchorium:nightly
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  report:
    if: failure()
    needs: [verify-clean, build, live-journeys, lighthouse, storybook, provider-sandboxes, image]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed="$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "- \(.key): \(.value.result)"')"
          body="$(printf 'Run %s on %s (%s) failed.\n\n%s\n\nLogs: `gh run view %s --log-failed`. Traces and reports: artifacts of the run.' \
            "$RUN_URL" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$failed" "$GITHUB_RUN_ID")"
          gh label create nightly --color B60205 --description 'Failure of the nightly verification' --force
          issue="$(gh issue list --label nightly --state open --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title 'Nightly verification failed' --label nightly --body "$body"
          fi
