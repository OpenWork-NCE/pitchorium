name: Diagnose

# A failure that only happens in CI, reproduced on the runner of the CI (docs/architecture/testing.md,
# ADR 0142): one journey against the real api, in one engine, repeated (30 times by default), every
# failure kept with its trace, video and the logs of the stack, after a report of the environment
# of the runner to compare with a workstation. Started by hand: gh workflow run diagnose.yaml.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: Title (or part) of the journey, a --grep of Playwright
        required: true
      browser:
        description: Engine
        type: choice
        options: [chromium, firefox, webkit]
        default: firefox
      repeat:
        description: Runs of the journey (--repeat-each)
        default: '30'
      turnstile:
        description: Turnstile of the stack (0 none, local the local stand-in, 1 Cloudflare test keys)
        default: '0'

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build

  repeat:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: build
      - name: Environment of the runner
        run: |
          echo "CPUs: $(nproc)"
          echo "Memory: $(free -m | awk '/Mem:/ {print $2}') MB"
          echo "Time zone: $(cat /etc/timezone 2>/dev/null || date +%Z) (TZ=${TZ:-unset})"
          echo "Locale: ${LANG:-unset}"
          echo "Fonts: $(fc-list 2>/dev/null | wc -l)"
          docker run --rm mcr.microsoft.com/playwright:v1.64.0-noble sh -c 'echo "Fonts in the Playwright image: $(fc-list | wc -l)"; nproc'
      # The inputs reach the shell as variables, never interpolated into the script.
      - name: The journey, repeated, without retry
        run: |
          case "$REPEAT" in ''|*[!0-9]*) echo "repeat must be a number" >&2; exit 2;; esac
          pnpm --filter @pitchorium/web test:e2e:live --project="$BROWSER" \
            --grep "$GREP" --repeat-each="$REPEAT" --retries=0
        env:
          GREP: ${{ inputs.grep }}
          BROWSER: ${{ inputs.browser }}
          REPEAT: ${{ inputs.repeat }}
          LIVE_SKIP_BUILD: '1'
          LIVE_TURNSTILE: ${{ inputs.turnstile }}
          LIVE_LOGS: ${{ runner.temp }}/live-logs
          PLAYWRIGHT_TRACE: retain-on-failure
          PLAYWRIGHT_VIDEO: retain-on-failure
      - if: always()
        run: >-
          node scripts/ci/playwright-summary.mjs apps/web/test-results/results.json
          "Diagnosis: $GREP ($BROWSER, $REPEAT runs)"
        env:
          GREP: ${{ inputs.grep }}
          BROWSER: ${{ inputs.browser }}
          REPEAT: ${{ inputs.repeat }}
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: diagnose-${{ inputs.browser }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/live-logs
          include-hidden-files: true
          if-no-files-found: ignore
