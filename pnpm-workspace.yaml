packages:
  - apps/*
  - packages/*

allowBuilds:
  unrs-resolver: true
  esbuild: true
  '@swc/core': true
  msgpackr-extract: true
  # Telemetry, optional native helpers and version checks: not needed.
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
  # next-intl message extraction: prebuilt binaries ship as optional dependencies.
  '@parcel/watcher': false

# better-auth lists Next.js and drizzle-kit as optional peers: present in the workspace (React
# Email preview, migrations), they would be resolved into the runtime of the server.
overrides:
  better-auth>next: '-'
  better-auth>drizzle-kit: '-'

# pnpm audit (CI): advisories accepted with their reason, reviewed at each dependency update.
auditConfig:
  ignoreGhsas:
    # braces, through eslint-plugin-boundaries (lint tooling, never in the image); no fix
    # published. Patterns come from the repository configuration only.
    - GHSA-vfj7-8cjw-p6xm

minimumReleaseAgeExclude:
  - lucide-react@1.53.0
  - nuqs@2.10.2
  - '@playwright/test@1.64.0'
  - playwright@1.64.0
  - playwright-core@1.64.0
  - react-email@6.11.1
  - '@react-email/ui@6.11.1'
  - '@aws-sdk/client-s3@3.1147.0'
  - '@aws-sdk/s3-request-presigner@3.1147.0'
  - '@opentelemetry/api-logs@0.223.0'
  - '@opentelemetry/configuration@0.223.0'
  - '@opentelemetry/context-async-hooks@2.12.0'
  - '@opentelemetry/core@2.12.0'
  - '@opentelemetry/exporter-logs-otlp-grpc@0.223.0'
  - '@opentelemetry/exporter-logs-otlp-http@0.223.0'
  - '@opentelemetry/exporter-logs-otlp-proto@0.223.0'
  - '@opentelemetry/exporter-metrics-otlp-grpc@0.223.0'
  - '@opentelemetry/exporter-metrics-otlp-http@0.223.0'
  - '@opentelemetry/exporter-metrics-otlp-proto@0.223.0'
  - '@opentelemetry/exporter-prometheus@0.223.0'
  - '@opentelemetry/exporter-trace-otlp-grpc@0.223.0'
  - '@opentelemetry/exporter-trace-otlp-http@0.223.0'
